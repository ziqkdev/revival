<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoroka</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 44px;
            letter-spacing: 2px;
        }

        .hero {
            padding: 70px 20px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 17px;
        }

        .button:hover {
            background: #333;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: #111;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ZOROKA</h1>
    </header>

    <section class="hero">
        <h2>Welcome to Zoroka</h2>
        <p>A new Roblox revival experience.</p>

        <a class="button" href="#">Download Client</a>
    </section>

    <footer>
        © 2026 Zoroka
    </footer>

</body>
</html>
